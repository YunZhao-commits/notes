name: 🧠 RAG Data Pump (Auto Vectorize)

on:
  push:
    paths:
      - '**/*.md' # 监听仓库里所有 Markdown 文件的变化

jobs:
  index-notes:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # 获取历史记录以便比对差异
      
      - name: ⚙️ 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: 🔍 寻找变更的文件
        id: changed
        run: |
          # 只找出本次提交中新增或修改的 .md 文件
          FILES=$(git diff --name-only --diff-filter=ACMR HEAD~1 HEAD -- '*.md' | tr '\n' ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT
          
      - name: 🚀 启动数据泵注入向量大脑
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          VECTORIZE_INDEX: "yunchu-notes"
        run: node scripts/index-notes.js ${{ steps.changed.outputs.files }}
